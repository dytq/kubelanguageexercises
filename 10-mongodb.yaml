apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: languageexercises-ns
spec:
  accessModes:
  - ReadWriteOnce
  resources: 
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  labels:
    app: mongodb-svc
  namespace: languageexercises-ns
spec:
  ports:
  - port: 27017
    name: database
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: languageexercises-ns
spec:
  serviceName: "mongodb-svc" 
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec: 
      containers:
      - name: mongodb
        image: mongo:6.0.16
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: xxx 
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: xxx 
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db 
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongo-pvc 
